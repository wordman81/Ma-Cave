<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma cave à vins</title>
<meta name="theme-color" content="#6B1633">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ma cave">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F0F3;--card:#FFFFFF;--ink:#1E1519;--mute:#75696F;--line:#E6E1E5;--wine:#7A1F3D;--onwine:#FFFFFF;--hero:#5B1730;--ok:#22704E;--warn:#98570F;--late:#A32F3A;--shadow:0 1px 2px rgba(30,10,20,.06),0 10px 28px rgba(30,10,20,.07);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#130E12;--card:#1F1820;--ink:#F3ECF0;--mute:#A89CA3;--line:#33292F;--wine:#D0587A;--onwine:#1A0F14;--hero:#3A1222;--ok:#6CC49B;--warn:#E3A55A;--late:#F08A93;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#130E12;--card:#1F1820;--ink:#F3ECF0;--mute:#A89CA3;--line:#33292F;--wine:#D0587A;--onwine:#1A0F14;--hero:#3A1222;--ok:#6CC49B;--warn:#E3A55A;--late:#F08A93;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 120px}
.hero{background:var(--hero);color:#fff;border-radius:26px;padding:24px 22px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
.kicker{margin:0 0 14px;font:italic 20px Georgia,'Palatino Linotype',serif;opacity:.85}
.big{display:flex;align-items:baseline;gap:10px}
.big b{font:700 64px/1 Georgia,'Palatino Linotype',serif;letter-spacing:-.03em}
.big span{font-size:15px;opacity:.8}
.mini{display:flex;gap:10px;margin-top:20px}
.sync{margin:14px 0 0;font-size:13px;opacity:.75}
.sync:empty{display:none}
.backup{background:var(--card);border-radius:22px;padding:18px;margin-top:26px;box-shadow:var(--shadow)}
.backup h3{margin:0 0 4px;font:600 20px Georgia,'Palatino Linotype',serif}
.backup p{margin:0 0 14px;font-size:14px;color:var(--mute)}
.backup p.due{color:var(--warn)}
.bkbtns{display:flex;gap:10px;flex-wrap:wrap}
.bkbtns button{flex:1 1 140px;padding:13px;border-radius:16px;border:0;background:var(--bg);color:var(--wine);font-weight:700;cursor:pointer}
.bkbtns button.main{background:var(--wine);color:var(--onwine)}
.mini div{flex:1;background:rgba(255,255,255,.12);border-radius:14px;padding:10px 14px}
.mini b{display:block;font-size:22px}
.mini span{font-size:13px;opacity:.8}
.mini.val{margin-top:10px}
.mini.val b{font-size:19px}
.valnote{margin:10px 2px 0;font-size:13px;opacity:.85}
.valnote:empty{display:none}
.search{width:100%;padding:14px 18px;border:0;border-radius:16px;background:var(--card);box-shadow:var(--shadow);margin-bottom:14px}
.search::placeholder{color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;scrollbar-width:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;border:0;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:9px 16px;cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--mute))}
.chip[aria-pressed="true"]{background:var(--wine);color:var(--onwine)}
.chip[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--onwine)}
.dhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.dhead label{flex:1}
.mic{flex:none;display:flex;align-items:center;gap:6px;margin-bottom:5px;border:0;border-radius:999px;padding:7px 14px;background:var(--bg);color:var(--wine);font-size:14px;font-weight:600;cursor:pointer}
.mic svg{width:16px;height:16px}
.mic.on{background:var(--late);color:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--late) 45%,transparent)}50%{box-shadow:0 0 0 7px transparent}}
.micmsg{font-size:13px;color:var(--mute);margin-top:6px;min-height:0}
.micmsg:empty{display:none}
.micmsg i{color:var(--ink)}
.sortbar{display:flex;align-items:center;gap:10px;margin:0 2px 14px}
.sortbar label{margin:0;font-size:14px;color:var(--mute);flex:none}
.sortbar select{flex:1;min-width:0;padding:10px 14px;border:0;border-radius:14px;background:var(--card);box-shadow:var(--shadow);cursor:pointer}
.bottle{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer}
.ico{flex:none;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.info{flex:1;min-width:0}
.appel{font-size:13px;font-weight:600;color:var(--wine);margin:0 0 2px}
.info h2{font:600 18px/1.25 Georgia,'Palatino Linotype',serif;margin:0 0 3px}
.sub{font-size:14px;color:var(--mute)}
.pill{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.qty{flex:none;display:flex;align-items:center;gap:2px;background:var(--bg);border-radius:999px;padding:3px}
.qty button{width:34px;height:34px;border:0;background:var(--card);border-radius:50%;cursor:pointer;font-size:18px;box-shadow:var(--shadow)}
.qty b{min-width:28px;text-align:center;font-size:17px}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:24px 4px 12px;padding-bottom:8px;font:700 21px/1.2 var(--serif,Georgia,serif);color:var(--wine);border-bottom:2px solid transparent;border-image:linear-gradient(90deg,var(--gold,var(--wine)),transparent) 1;text-shadow:0 0 8px var(--bg),0 0 3px var(--bg)}
.ghead span{min-width:0;overflow-wrap:anywhere}
.ghead small{flex:none;font:600 12.5px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--mute)}
.grp:first-child .ghead{margin-top:4px}
.empty{text-align:center;color:var(--mute);padding:48px 16px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--wine);color:var(--onwine);border:0;border-radius:999px;padding:16px 28px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.35);cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(10,4,8,.55);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.open{display:flex}
.panel{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:28px 28px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.panel h3{margin:0 0 6px;font:600 24px Georgia,'Palatino Linotype',serif}
label{display:block;font-size:13.5px;color:var(--mute);margin:12px 0 5px}
.panel input,.panel select,.panel textarea{width:100%;padding:12px 14px;border:0;border-radius:14px;background:var(--bg)}
.row{display:flex;gap:10px}.row>div{flex:1}
.actions{display:flex;gap:10px;margin-top:22px}
.dup{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;padding:13px;border:1.5px dashed color-mix(in srgb,var(--wine) 45%,transparent);border-radius:16px;background:transparent;color:var(--wine);font-weight:700;cursor:pointer}
.dup svg{width:18px;height:18px}
.dup + .actions{margin-top:12px}
.actions button{flex:1;padding:14px;border-radius:16px;border:0;background:var(--bg);cursor:pointer}
.actions .save{background:var(--wine);color:var(--onwine);font-weight:700}
.actions .del{color:var(--late)}
.ico img{width:100%;height:100%;object-fit:cover;border-radius:16px}
.desc{font-size:13.5px;color:var(--mute);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.photo{display:grid;place-items:center;min-height:120px;margin-top:10px;border-radius:18px;background:var(--bg);border:1.5px dashed var(--line);color:var(--mute);text-align:center;padding:12px;cursor:pointer;overflow:hidden}
.photo img{max-width:100%;max-height:220px;border-radius:12px}
.pbtns{display:flex;gap:8px;margin-top:8px}
.pbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;margin:0;padding:11px 8px;border-radius:14px;background:var(--bg);color:var(--wine);font-size:14px;font-weight:600;cursor:pointer;text-align:center}
.pbtn.main{background:var(--wine);color:var(--onwine)}
.pbtn svg{width:18px;height:18px;flex:none}
.link{border:0;background:none;color:var(--late);padding:8px 0 0;cursor:pointer;font-size:14px}
.weblink{display:block;text-align:center;margin-top:8px;padding:12px;border-radius:14px;background:var(--bg);color:var(--wine);font-weight:600;text-decoration:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--wine);outline-offset:2px}

 0z'/%3E%3Cpath d='M11 20v14M4 34h14'/%3E%3C/g%3E %3Cg transform='translate%2880 70%29'%3E%3Ccircle cx='0' cy='0' r='4'/%3E%3Ccircle cx='8' cy='3' r='4'/%3E%3Ccircle cx='3' cy='10' r='4'/%3E%3C/g%3E %3Cg transform='translate%28250 250%29'%3E%3Ccircle cx='0' cy='0' r='4'/%3E%3Ccircle cx='8' cy='-3' r='4'/%3E%3C/g%3E %3Cg transform='translate%2892 238%29 rotate%2830%29'%3E%3Cpath d='M0 8c6-8 14-10 22-6-4 8-12 10-22 6z'/%3E%3Cpath d='M0 8c6-2 12-4 18-5'/%3E%3C/g%3E %3C/svg%3E");-webkit-mask-size:280px 280px;mask-size:280px 280px;-webkit-mask-repeat:repeat;mask-repeat:repeat}

/* ——— Habillage chaleureux ——— */
:root{--bg:#F6EEE3;--card:#FFFBF5;--ink:#2A1A17;--mute:#7C6A62;--line:#E7DACB;--wine:#8A1E3F;--onwine:#FFF8EE;--hero:#6B1633;--gold:#B8893A;--goldsoft:#E9D3A6;
  --shadow:0 1px 2px rgba(80,30,20,.07),0 12px 30px rgba(110,40,30,.10);--wm:rgba(138,30,63,.5);--serif:'Playfair Display',Georgia,'Palatino Linotype',serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A1211;--card:#271C1A;--ink:#F5EBE2;--mute:#B3A298;--line:#3A2C29;--wine:#E0708F;--onwine:#240F16;--hero:#4A1022;--gold:#DDB864;--goldsoft:#5A4524;--shadow:0 1px 2px rgba(0,0,0,.45),0 12px 30px rgba(0,0,0,.35);--wm:rgba(224,112,143,.42)}}
:root[data-theme="dark"]{--bg:#1A1211;--card:#271C1A;--ink:#F5EBE2;--mute:#B3A298;--line:#3A2C29;--wine:#E0708F;--onwine:#240F16;--hero:#4A1022;--gold:#DDB864;--goldsoft:#5A4524;--shadow:0 1px 2px rgba(0,0,0,.45),0 12px 30px rgba(0,0,0,.35);--wm:rgba(224,112,143,.42)}
body{background:var(--bg) radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--gold) 14%,transparent),transparent 70%) no-repeat}
.hero{position:relative;overflow:hidden;color:#FFF6EA;background:
  radial-gradient(90% 70% at 100% 0%,rgba(233,190,110,.30),transparent 60%),
  radial-gradient(70% 60% at 0% 100%,rgba(255,120,150,.18),transparent 65%),
  linear-gradient(145deg,#9B2447 0%,#6B1633 48%,#3E0B1E 100%);
  box-shadow:0 18px 40px rgba(107,22,51,.35);border:1px solid rgba(233,190,110,.35)}
.hero>*:not(.hdeco){position:relative}
.hdeco{position:absolute;right:-14px;top:-8px;width:130px;height:160px;color:#F2D49A;opacity:.28;transform:rotate(14deg);pointer-events:none}
.kicker{font:italic 500 21px var(--serif);color:#F2D49A;opacity:1;letter-spacing:.01em}
.kicker::after{content:"";display:block;width:44px;height:2px;margin-top:8px;border-radius:2px;background:linear-gradient(90deg,#F2D49A,transparent)}
.big b{font:700 66px/1 var(--serif);color:#FFE9C4;text-shadow:0 2px 14px rgba(0,0,0,.25)}
.big span{opacity:.9}
.mini div{background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.06));border:1px solid rgba(242,212,154,.25);backdrop-filter:blur(2px)}
.mini b{font-family:var(--serif);color:#FFE9C4}
.mini span{opacity:.88}
.mini.val b{color:#F2D49A}
.search{background:var(--card);border:1px solid var(--line)}
.chip{background:var(--card);border:1px solid var(--line);font-weight:600}
.chip i{box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--mute)) 22%,transparent)}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,#A3284D,#6B1633);color:#FFF6EA;border-color:transparent;box-shadow:0 6px 16px rgba(107,22,51,.3)}
.sortbar select{border:1px solid var(--line)}
.bottle{position:relative;overflow:hidden;border:1px solid var(--line);padding-left:18px;transition:transform .15s ease,box-shadow .15s ease}
.bottle::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 55%,#000))}
.bottle:active{transform:scale(.99)}
.ico{background:linear-gradient(150deg,color-mix(in srgb,var(--c) 26%,transparent),color-mix(in srgb,var(--c) 8%,transparent));border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.appel{color:var(--gold);text-transform:uppercase;letter-spacing:.06em;font-size:11.5px;font-weight:700}
.info h2{font-family:var(--serif);font-weight:700}
.qty{background:color-mix(in srgb,var(--gold) 14%,var(--bg));border:1px solid color-mix(in srgb,var(--gold) 30%,transparent)}
.qty b{font-family:var(--serif);font-weight:700}
.fab{background:linear-gradient(135deg,#A3284D,#6B1633);color:#FFF6EA;box-shadow:0 10px 26px rgba(107,22,51,.45),0 0 0 3px color-mix(in srgb,var(--gold) 55%,transparent)}
.panel{background:var(--card);border-top:3px solid var(--gold)}
.panel h3,.backup h3{font-family:var(--serif);font-weight:700}
.panel h3::after,.backup h3::after{content:"";display:block;width:40px;height:2px;margin-top:6px;border-radius:2px;background:linear-gradient(90deg,var(--gold),transparent)}
.actions .save,.bkbtns button.main,.pbtn.main{background:linear-gradient(135deg,#A3284D,#6B1633);color:#FFF6EA}

/* Filigrane visible à travers les fiches */

</style>

<body>
<div class="wrap">
  <header class="hero"><svg class="hdeco" viewBox="0 0 120 150" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M62 6c3 10 0 18-7 22"/><path d="M64 14c12-8 30-4 36 8-14 5-28 2-36-8z"/><path d="M64 14c10 0 20 2 28 7"/><g fill="currentColor" fill-opacity=".18"><circle cx="38" cy="38" r="11"/><circle cx="60" cy="38" r="11"/><circle cx="82" cy="40" r="11"/><circle cx="48" cy="58" r="11"/><circle cx="70" cy="59" r="11"/><circle cx="36" cy="78" r="11"/><circle cx="58" cy="79" r="11"/><circle cx="80" cy="80" r="11"/><circle cx="46" cy="99" r="11"/><circle cx="68" cy="100" r="11"/><circle cx="57" cy="120" r="11"/></g></svg><p class="kicker">Ma cave</p><div class="big"><b id="sBot">0</b><span>Bouteilles en cave</span></div><div class="mini"><div><b id="sRef">0</b><span>Références</span></div><div><b id="sNow">0</b><span>À boire</span></div></div><div class="mini val"><div><b id="sBuy">–</b><span>Valeur d’achat</span></div><div><b id="sCote">–</b><span>Cote actuelle</span></div></div><p class="valnote" id="sVal"></p><p class="sync" id="sync" aria-live="polite"></p></header>
  <input class="search" id="q" type="search" placeholder="Rechercher une appellation, un nom, un domaine…" aria-label="Rechercher">
  <div class="chips" id="chips"></div>
  <div class="sortbar"><label for="sort">Trier par</label>
    <select id="sort">
      <option value="recent">Ajout le plus récent</option>
      <option value="apogee">Apogée (à boire en premier)</option>
      <option value="yearAsc">Millésime (du plus ancien)</option>
      <option value="yearDesc">Millésime (du plus récent)</option>
      <option value="priceAsc">Prix (croissant)</option>
      <option value="priceDesc">Prix (décroissant)</option>
      <option value="app">Appellation (A à Z)</option>
      <option value="country">Pays (A à Z)</option>

    <input type="file" id="bkFile" accept="application/json,.json" hidden>
  </section>
</div>
<button class="fab" id="add">+ Ajouter un vin</button>

<div class="sheet" id="sheet"><div class="panel" role="dialog" aria-modal="true" aria-labelledby="ttl">
  <h3 id="ttl">Ajouter un vin</h3>
  <label class="photo" for="fCam"><img id="pPrev" alt="Photo du vin" hidden><span id="pTxt">Touchez pour photographier la bouteille ou l'étiquette</span></label>
  <div class="pbtns">
    <label for="fCam" class="pbtn main"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>Prendre une photo</label>
    <label for="fPhoto" class="pbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>Choisir dans la galerie</label>
  </div>
  <input id="fCam" type="file" accept="image/*" capture="environment" hidden>
  <input id="fPhoto" type="file" accept="image/*" hidden>
  <button type="button" id="pDel" class="link" hidden>Retirer la photo</button>
  <label for="fApp">Appellation</label><input id="fApp" placeholder="Saint-Émilion Grand Cru, Chablis…">
  <label for="fName">Nom de la cuvée</label><input id="fName">
  <label for="fDom">Domaine ou producteur</label><input id="fDom">
  <div class="row">

  <div class="row">
    <div><label for="fQty">Quantité</label><input id="fQty" type="number" inputmode="numeric" min="0" value="1"></div>
    <div><label for="fSize">Contenance</label><select id="fSize"><option>37,5 cl</option><option selected>75 cl</option><option>150 cl (magnum)</option><option>300 cl (double magnum)</option><option>Autre</option></select></div>
  </div>
  <div class="row">
    <div><label for="fPrice">Prix d'achat (€)</label><input id="fPrice" type="number" inputmode="decimal" min="0" step="0.01"></div>
    <div><label for="fCote">Cote actuelle (€)</label><input id="fCote" type="number" inputmode="decimal" min="0" step="0.01"></div>
  </div>
  <div class="row">
    <div><label for="fFrom">À boire dès</label><input id="fFrom" type="number" inputmode="numeric" placeholder="2025"></div>
    <div><label for="fTo">Jusqu'en</label><input id="fTo" type="number" inputmode="numeric" placeholder="2035"></div>
  </div>
  <div class="dhead"><label for="fDesc">Encépagement</label><button type="button" id="mic" class="mic" aria-pressed="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg><span>Dicter</span></button></div>
  <textarea id="fDesc" rows="3" placeholder="Merlot 70 %, Cabernet franc 30 %…"></textarea>
  <div class="micmsg" id="micMsg" aria-live="polite"></div>
  <a id="webSearch" class="weblink" href="#" target="_blank" rel="noopener noreferrer">Rechercher ce vin sur le web</a>
  <div class="dhead"><label for="fNote">Notes de dégustation</label><button type="button" id="micN" class="mic" aria-pressed="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg><span>Dicter</span></button></div>
  <textarea id="fNote" rows="3"></textarea>
  <div class="micmsg" id="micMsgN" aria-live="polite"></div>
  <button type="button" id="dup" class="dup" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>Dupliquer pour un autre millésime</button>
  <div class="actions">
    <button id="cancel">Annuler</button>
    <button id="del" class="del" hidden>Supprimer</button>
    <button id="save" class="save">Enregistrer</button>
  </div>
</div></div>

<script>
(function(){
var YEAR=new Date().getFullYear(), KEY='cave-a-vins-v1';
var COL={'Rouge':'#8B2237','Blanc':'#C9A93B','Rosé':'#D98A94','Pétillant':'#7FA3A0'};
var BOTTLE='<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true"><path d="M10 2h4v3c0 1 .8 1.6 1.4 2.6.4.7.6 1.5.6 2.4V21a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V10c0-.9.2-1.7.6-2.4C9.2 6.6 10 6 10 5V2z"/></svg>';
var bottles=[], filter='Tous', editing=null;
try{var raw=localStorage.getItem(KEY); if(raw) bottles=JSON.parse(raw)||[];}catch(e){bottles=[];}
/* Stockage sur le téléphone (IndexedDB, avec repli sur localStorage) */
var idb=null, saving=Promise.resolve();
function openDB(){return new Promise(function(res,rej){var r=indexedDB.open('ma-cave',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function idbReq(mode,fn){return new Promise(function(res,rej){var tx=idb.transaction('kv',mode),rq=fn(tx.objectStore('kv'));tx.oncomplete=function(){res(rq.result);};tx.onerror=tx.onabort=function(){rej(tx.error);};});}
function persist(){
  var copy=JSON.parse(JSON.stringify(bottles));
  saving=saving.then(function(){if(!idb)throw 0;return idbReq('readwrite',function(st){return st.put(copy,'bottles');});})
    .catch(function(){try{localStorage.setItem(KEY,JSON.stringify(copy));}catch(e){alert('Stockage plein : retirez des photos ou exportez puis allégez la cave.');}});
}
function write(){} // (synchronisation en ligne absente de la version autonome)
function syncText(){}
function clean(b){var o={};for(var k in b){if(k!=='id'&&b[k]!==undefined)o[k]=b[k];}return o;}
function created(b){return b.created||parseInt(String(b.id).slice(1),10)||0;}
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function status(b){
  if(b.to&&b.to<YEAR) return {t:'À boire sans attendre, apogée dépassée',c:'var(--late)'};
  if(b.from&&b.from>YEAR) return {t:'À garder jusqu\u2019en '+b.from,c:'var(--warn)'};
  if(b.from||b.to) return {t:'À boire maintenant',c:'var(--ok)'};
  return null;
}
function render(){
  bkInfo();
  var q=$('q').value.trim().toLowerCase(), total=0, now=0;
  bottles.forEach(function(b){total+=b.qty; var s=status(b); if(s&&s.c!=='var(--warn)') now+=b.qty;});
  $('sBot').textContent=total; $('sRef').textContent=bottles.length; $('sNow').textContent=now;
  var buy=0,cote=0,noBuy=0,noCote=0,both=0,bothBuy=0,bothCote=0;
  bottles.forEach(function(b){
    if(!b.qty)return;
    if(b.price!=null)buy+=b.price*b.qty;else noBuy++;
    if(b.cote!=null)cote+=b.cote*b.qty;else noCote++;
    if(b.price!=null&&b.cote!=null){bothBuy+=b.price*b.qty;bothCote+=b.cote*b.qty;both++;}
  });
  var eur=function(v){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:v<1000?2:0,minimumFractionDigits:0}).format(v);};
  $('sBuy').textContent=buy||noBuy<bottles.filter(function(b){return b.qty;}).length?eur(buy):'–';
  $('sCote').textContent=cote||noCote<bottles.filter(function(b){return b.qty;}).length?eur(cote):'–';
  var notes=[];
  if(both&&bothBuy>0){var diff=bothCote-bothBuy,pc=Math.round(diff/bothBuy*100);notes.push((diff>=0?'Plus-value : +':'Moins-value : −')+eur(Math.abs(diff))+' ('+(diff>=0?'+':'−')+Math.abs(pc)+' %)'+(both<bottles.filter(function(b){return b.qty;}).length?' sur les vins ayant les deux montants':''));}
  var miss=[];if(noBuy)miss.push(noBuy+' sans prix d’achat');if(noCote)miss.push(noCote+' sans cote');
  if(miss.length&&(buy||cote))notes.push('Références en cave : '+miss.join(', ')+'.');
  $('sVal').textContent=notes.join(' · ');
  var types=['Tous','Rouge','Blanc','Rosé','Pétillant'];
  $('chips').innerHTML=types.map(function(t){return '<button class="chip" data-t="'+t+'" aria-pressed="'+(t===filter)+'">'+(COL[t]?'<i style="--c:'+COL[t]+'"></i>':'')+t+'</button>';}).join('');
  var items=bottles.filter(function(b){
    if(filter!=='Tous'&&b.type!==filter) return false;
    return !q||[b.app,b.name,b.dom,b.reg,b.country,b.desc].join(' ').toLowerCase().indexOf(q)>-1;
  });
  var mode=$('sort').value;
  function txt(a,b){ // ordre alphabétique français, champs vides en fin de liste
    a=(a||'').trim();b=(b||'').trim();
    if(!a&&!b) return 0; if(!a) return 1; if(!b) return -1;
    return a.localeCompare(b,'fr',{sensitivity:'base'});
  }
  function cmp(a,b,asc){ // valeurs vides toujours en fin de liste
    if(a==null&&b==null) return 0; if(a==null) return 1; if(b==null) return -1;
    return asc?a-b:b-a;
  }
  if(mode==='recent') items.sort(function(a,b){return created(b)-created(a);});
  else items.sort(function(a,b){
    if(mode==='apogee') return cmp(a.to,b.to,true)||cmp(a.from,b.from,true)||cmp(a.year,b.year,true);
    if(mode==='yearAsc') return cmp(a.year,b.year,true);
    if(mode==='yearDesc') return cmp(a.year,b.year,false);
    if(mode==='priceAsc') return cmp(a.price,b.price,true);
    if(mode==='priceDesc') return cmp(a.price,b.price,false);
    if(mode==='app') return txt(a.app,b.app)||txt(a.name,b.name);
    if(mode==='country') return txt(a.country,b.country)||txt(a.reg,b.reg)||txt(a.app,b.app)||txt(a.name,b.name);
    if(mode==='reg') return txt(a.reg,b.reg)||txt(a.app,b.app)||txt(a.name,b.name);
    return 0;
  });
  if(!items.length){
    $('list').innerHTML='<div class="empty">'+(bottles.length?'Aucun vin ne correspond à cette recherche.':'Votre cave est vide. Touchez « Ajouter un vin » pour enregistrer votre première bouteille.')+'</div>';
    return;
  }
  var card=function(b){
    var s=status(b);
    return '<div class="bottle" data-id="'+b.id+'" style="--c:'+COL[b.type]+'"><div class="ico">'+(b.photo?'<img src="'+b.photo+'" alt="">':BOTTLE)+'</div><div class="info">'+(b.app?'<div class="appel">'+esc(b.app)+'</div>':'')+'<h2>'+esc(b.name||'Sans nom')+'</h2><div class="sub">'+esc([b.year,b.size,b.dom,b.reg,b.country].filter(Boolean).join(' \u00b7 '))+'</div>'+((b.price!=null||b.cote!=null)?'<div class="sub">'+esc([b.price!=null?'Achat '+String(b.price).replace('.',',')+' \u20ac':'',b.cote!=null?'Cote '+String(b.cote).replace('.',',')+' \u20ac':''].filter(Boolean).join(' \u00b7 '))+'</div>':'')+(b.desc?'<div class="desc">'+esc(b.desc)+'</div>':'')+(s?'<span class="pill" style="--c:'+s.c+'">'+s.t+'</span>':'')+'</div><div class="qty"><button data-a="minus" aria-label="Retirer une bouteille">\u2212</button><b>'+b.qty+'</b><button data-a="plus" aria-label="Ajouter une bouteille">+</button></div></div>';
  };
  /* Titres de séparation selon le tri choisi */
  var norm=function(t){return String(t).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');};
  var group=function(b){
    if(mode==='country') return b.country&&b.country.trim()?b.country.trim():'Pays non renseigné';
    if(mode==='reg') return b.reg&&b.reg.trim()?b.reg.trim():'Région non renseignée';
    if(mode==='app') return b.app&&b.app.trim()?b.app.trim():'Appellation non renseignée';
    if(mode==='yearAsc'||mode==='yearDesc') return b.year?String(b.year):'Sans millésime';
    if(mode==='apogee'){var st=status(b);if(!st)return 'Apogée non renseignée';return st.c==='var(--late)'?'Apogée dépassée':st.c==='var(--warn)'?'À garder':'À boire maintenant';}
    return null;
  };
  if(mode==='apogee'){
    var rank={'Apogée dépassée':0,'À boire maintenant':1,'À garder':2,'Apogée non renseignée':3};
    items=items.map(function(b,i){return [b,i];}).sort(function(x,y){return rank[group(x[0])]-rank[group(y[0])]||x[1]-y[1];}).map(function(x){return x[0];});
  }
  if(group(items[0])===null){$('list').innerHTML=items.map(card).join('');return;}
  var groups=[],cur=null;
  items.forEach(function(b){
    var g=group(b),k=norm(g);
    if(!cur||cur.k!==k){cur={k:k,label:g,items:[]};groups.push(cur);}
    cur.items.push(b);
  });
  $('list').innerHTML=groups.map(function(g){
    var n=0;g.items.forEach(function(b){n+=b.qty||0;});
    var r=g.items.length;
    return '<section class="grp"><h3 class="ghead"><span>'+esc(g.label)+'</span><small>'+n+' bouteille'+(n>1?'s':'')+' \u00b7 '+r+' référence'+(r>1?'s':'')+'</small></h3>'+g.items.map(card).join('')+'</section>';
  }).join('');
}
function num(v){var n=parseFloat(v);return isNaN(n)?null:n;}
var photo=null;
function setPhoto(d){photo=d||null;$('pPrev').hidden=!photo;if(photo)$('pPrev').src=photo;$('pTxt').hidden=!!photo;$('pDel').hidden=!photo;}
$('fCam').onchange=$('fPhoto').onchange=function(){var file=this.files&&this.files[0];if(!file)return;var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);setPhoto(c.toDataURL('image/jpeg',.72));};im.src=r.result;};
  r.readAsDataURL(file);this.value='';};
$('pDel').onclick=function(){setPhoto(null);};
$('webSearch').onclick=function(e){
  if(!$('fName').value.trim()){e.preventDefault();$('fName').focus();return;}
  var q=[$('fApp').value,$('fName').value,$('fDom').value,$('fYear').value,'vin'].map(function(s){return String(s).trim();}).filter(Boolean).join(' ');
  this.href='https://www.google.com/search?q='+encodeURIComponent(q);
};

/* Dictée vocale (encépagement et notes) */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition, rec=null, active=null;
var MICS=[{btn:'mic',field:'fDesc',msg:'micMsg'},{btn:'micN',field:'fNote',msg:'micMsgN'}];
function micMsg(h,m){(m?[m]:MICS).forEach(function(x){$(x.msg).innerHTML=h||'';});}
function micUI(m,on){var b=$(m.btn);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.querySelector('span').textContent=on?'Arrêter':'Dicter';}
function stopMic(){if(rec&&active){try{rec.stop();}catch(e){}}}
function startMic(m){
  rec=new SR();rec.lang='fr-FR';rec.continuous=true;rec.interimResults=true;
  var base=$(m.field).value, r=rec;
  r.onstart=function(){active=m;micUI(m,true);micMsg('Parlez, je vous écoute…',m);};
  r.onresult=function(e){
    var interim='';
    for(var i=e.resultIndex;i<e.results.length;i++){
      var t=e.results[i][0].transcript.trim();
      if(!t)continue;
      if(e.results[i].isFinal){
        t=t.charAt(0).toUpperCase()+t.slice(1);
        if(!/[.!?…]$/.test(t))t+='.';
        base=(base&&!/\s$/.test(base)?base+' ':base)+t;
        $(m.field).value=base;
      } else interim+=t+' ';
    }
    micMsg(interim?'<i>'+esc(interim.trim())+'</i>':'Parlez, je vous écoute…',m);
  };
  r.onerror=function(e){
    var t={'not-allowed':'Accès au micro refusé. Autorisez le micro pour cette page, ou utilisez le bouton micro de votre clavier.','service-not-allowed':'La dictée n\u2019est pas autorisée ici. Utilisez le bouton micro de votre clavier.','no-speech':'Je n\u2019ai rien entendu, réessayez.','audio-capture':'Aucun micro détecté.','network':'La dictée nécessite une connexion internet.'};
    micMsg(t[e.error]||'La dictée s\u2019est interrompue.',m);
  };
  r.onend=function(){micUI(m,false);if(active===m)active=null;if(/écoute/.test($(m.msg).textContent))micMsg('',m);if(m.next){var n=m.next;m.next=null;startMic(n);}};
  try{r.start();}catch(err){micMsg('Impossible de lancer la dictée. Utilisez le bouton micro de votre clavier.',m);}
}
if(SR){
  MICS.forEach(function(m){
    $(m.btn).hidden=false;
    $(m.btn).onclick=function(){
      if(active===m){stopMic();return;}
      if(active){active.next=m;stopMic();return;} // bascule d'un champ à l'autre
      startMic(m);
    };
  });
}
function openSheet(b){
  editing=b?b.id:null;
  $('ttl').textContent=b?'Modifier le vin':'Ajouter un vin';
  $('del').hidden=!b; $('dup').hidden=!b;
  var m=b||{qty:1,type:'Rouge'};
  $('fApp').value=m.app||''; $('fName').value=m.name||''; $('fDom').value=m.dom||''; $('fYear').value=m.year||''; $('fType').value=m.type;
  $('fCountry').value=m.country||''; $('fReg').value=m.reg||''; $('fQty').value=m.qty; $('fPrice').value=m.price==null?'':m.price; $('fCote').value=m.cote==null?'':m.cote;
  $('fFrom').value=m.from||''; $('fTo').value=m.to||''; $('fSize').value=m.size||'75 cl'; $('fDesc').value=m.desc||''; setPhoto(m.photo); $('fNote').value=m.note||''; micMsg('');
  $('sheet').classList.add('open'); $('fName').focus();
}
function closeSheet(){stopMic();micMsg('');$('sheet').classList.remove('open');}
$('add').onclick=function(){openSheet(null);};
$('dup').onclick=function(){ // même vin, nouveau millésime : on garde la fiche, on vide ce qui dépend de l'année
  stopMic();micMsg('');
  editing=null;
  $('ttl').textContent='Nouveau millésime';
  $('del').hidden=true;$('dup').hidden=true;
  $('fYear').value='';$('fFrom').value='';$('fTo').value='';$('fNote').value='';$('fQty').value=1;
  $('sheet').querySelector('.panel')&&($('sheet').querySelector('.panel').scrollTop=0);
  $('fYear').focus();
};
$('cancel').onclick=closeSheet;
$('sheet').onclick=function(e){if(e.target===$('sheet'))closeSheet();};
$('save').onclick=function(){
  var name=$('fName').value.trim();
  if(!name){$('fName').focus();return;}
  var d={app:$('fApp').value.trim(),name:name,dom:$('fDom').value.trim(),year:num($('fYear').value),type:$('fType').value,country:$('fCountry').value.trim(),reg:$('fReg').value.trim(),
    qty:Math.max(0,Math.floor(num($('fQty').value)||0)),price:num($('fPrice').value),cote:num($('fCote').value),from:num($('fFrom').value),to:num($('fTo').value),
    note:$('fNote').value.trim(),size:$('fSize').value,desc:$('fDesc').value.trim(),photo:photo};
  var id=editing;
  if(id){var old=bottles.filter(function(b){return b.id===id;})[0];d.created=old?created(old):Date.now();bottles=bottles.map(function(b){return b.id===id?Object.assign({id:id},d):b;});}
  else{d.created=Date.now();id='b'+d.created;d.id=id;bottles.unshift(d);}
  write(id,clean(d));persist();closeSheet();render();
};
$('del').onclick=function(){
  if(!confirm('Supprimer ce vin de la cave ?'))return;
  var id=editing;bottles=bottles.filter(function(b){return b.id!==id;});
  write(id,null);persist();closeSheet();render();
};
$('q').oninput=render;
try{var sv=localStorage.getItem(KEY+'-sort'); if(sv&&$('sort').querySelector('option[value="'+sv+'"]')) $('sort').value=sv;}catch(e){}
$('sort').onchange=function(){try{localStorage.setItem(KEY+'-sort',this.value);}catch(e){} render();};
$('chips').onclick=function(e){var t=e.target.closest('.chip');if(!t)return;filter=t.dataset.t;render();};
$('list').onclick=function(e){
  var card=e.target.closest('.bottle');if(!card)return;
  var b=bottles.filter(function(x){return x.id===card.dataset.id;})[0];if(!b)return;
  var a=e.target.closest('button');
  if(a){b.qty=Math.max(0,b.qty+(a.dataset.a==='plus'?1:-1));write(b.id,clean(b));persist();render();}
  else openSheet(b);
};
render();
/* Sauvegarde : export / import */
var BK=KEY+'-lastbackup';
function bkInfo(){
  var t=null;try{t=parseInt(localStorage.getItem(BK),10)||null;}catch(e){}
  var p=$('bkInfo');
  if(!t){p.textContent=bottles.length?'Aucune sauvegarde pour l\u2019instant. Exportez votre cave pour la conserver en lieu sûr (Google Drive, e-mail…).':'Exportez régulièrement votre cave pour la conserver en lieu sûr, ou importez une sauvegarde existante.';p.className=bottles.length?'due':'';return;}
  var days=Math.floor((Date.now()-t)/864e5);
  p.textContent='Dernière sauvegarde le '+new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})+'.'+(days>=30?' Pensez à en refaire une.':'');
  p.className=days>=30?'due':'';
}
$('bkExport').onclick=async function(){
  var data=JSON.stringify({app:'ma-cave-a-vins',version:1,exported:new Date().toISOString(),bottles:bottles});
  var name='cave-a-vins-'+new Date().toISOString().slice(0,10)+'.json';
  var file=null;try{file=new File([data],name,{type:'application/json'});}catch(e){}
  var done=false;
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'Sauvegarde de ma cave à vins'});done=true;}
    catch(e){if(e&&e.name==='AbortError')return;}
  }
  if(!done){
    var url=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},4000);
  }
  try{localStorage.setItem(BK,String(Date.now()));}catch(e){}
  bkInfo();
};
$('bkImport').onclick=function(){$('bkFile').click();};
$('bkFile').onchange=function(){
  var f=this.files&&this.files[0];this.value='';if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var list;
    try{var j=JSON.parse(r.result);list=Array.isArray(j)?j:j.bottles;}catch(e){}
    if(!Array.isArray(list)){alert('Ce fichier n\u2019est pas une sauvegarde de cave à vins.');return;}
    list=list.filter(function(b){return b&&typeof b==='object'&&b.name;});
    if(!list.length){alert('Aucun vin trouvé dans ce fichier.');return;}
    if(!confirm('Importer '+list.length+' vin'+(list.length>1?'s':'')+' ? Les fiches déjà présentes seront mises à jour, les autres vins de votre cave sont conservés.'))return;
    var byId={};bottles.forEach(function(b){byId[b.id]=b;});
    list.forEach(function(b){
      var d=Object.assign({},b);
      if(!d.id)d.id='b'+Date.now()+Math.floor(Math.random()*1e4);
      d.qty=Math.max(0,Math.floor(Number(d.qty)||0));
      if(!COL[d.type])d.type='Rouge';
      d.created=created(d)||Date.now();
      byId[d.id]=d;
    });
    bottles=Object.keys(byId).map(function(k){return byId[k];});
    persist();render();bkInfo();
    alert('Import terminé : '+list.length+' vin'+(list.length>1?'s':'')+' ajouté'+(list.length>1?'s':'')+' ou mis à jour.');
  };
  r.readAsText(f);
};
bkInfo();
(async function(){
  try{
    idb=await openDB();
    var saved=await idbReq('readonly',function(st){return st.get('bottles');});
    if(Array.isArray(saved)){bottles=saved;render();bkInfo();}
    else if(bottles.length)persist(); // reprise des données déjà présentes
  }catch(e){idb=null;}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
})();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>
